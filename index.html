<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Love Message</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffeef2;
      font-family: "Segoe UI", sans-serif;
    }
    .container {
      text-align: center;
      position: relative; /* Đã thêm: Quan trọng cho hiệu ứng trái tim */
      overflow: hidden; /* Đã thêm: Giúp trái tim không tràn ra ngoài khi bay lên */
      padding: 50px; /* Thêm padding để có không gian xung quanh nút */
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #ff7da6;
      color: white;
      transition: 0.2s;
      z-index: 10; /* Đảm bảo nút nằm trên trái tim */
    }
    button:hover {
      background: #ff527f;
    }
    #message {
      margin-top: 24px;
      font-size: 22px;
      max-width: 300px;
      line-height: 1.4;
      color: #b20047;
      z-index: 10; /* Đảm bảo tin nhắn nằm trên trái tim */
    }

    /* START: CSS CHO HIỆU ỨNG TRÁI TIM */
    .heart {
        position: absolute;
        color: red;
        font-size: 24px;
        opacity: 1;
        pointer-events: none; /* Không chặn click */
        animation: burst 1s ease-out forwards;
        z-index: 5; /* Nằm dưới nút và tin nhắn */
    }

    @keyframes burst {
        0% {
            transform: translateY(0) scale(1);
            opacity: 1;
            filter: blur(0px);
        }
        100% {
            transform: translateY(-200px) scale(1.5);
            opacity: 0;
            filter: blur(2px);
        }
    }
    /* END: CSS CHO HIỆU ỨNG TRÁI TIM */
  </style>
</head>
<body>

    <button onclick="showMessage()">Nhấn vào đây nè</button>
    <div id="message"></div>
  </div>

    function showMessage() {
      const randomIndex = Math.floor(Math.random() * messages.length);

    document.querySelector('.container').addEventListener('click', function(e) {

        const x = e.clientX - e.currentTarget.offsetLeft;
        const y = e.clientY - e.currentTarget.offsetTop;

        // 2. Tạo phần tử trái tim
        const heart = document.createElement('span');
        heart.classList.add('heart');
        heart.innerHTML = '❤️'; 

        // 3. Đặt vị trí ban đầu
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;

        // 4. Thêm trái tim vào container
        this.appendChild(heart);

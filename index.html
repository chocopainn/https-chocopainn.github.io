<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Love Message</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffeef2;
      font-family: "Segoe UI", sans-serif;
    }
    .container {
      text-align: center;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #ff7da6;
      color: white;
      transition: 0.2s;
    }
    button:hover {
      background: #ff527f;
    }
    #message {
      margin-top: 24px;
      font-size: 22px;
      max-width: 300px;
      line-height: 1.4;
      color: #b20047;
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="showMessage()">Nhấn vào đây nè</button>
    <div id="message"></div>
  </div>

  <script>
    const messages = [
      "Hôm nay em đẹp lắm đó.",
      "Đi làm nhớ giữ sức khỏe nha.",
      "Anh thương em nhiều lắm.",
      "Có em là điều tuyệt nhất trong ngày của anh.",
      "Em cười một cái là anh tan luôn đó.",
      "Nhớ em chút xíu rồi nè.",
      "Cảm ơn em vì đã ở đây với anh.",
      "Ngày nào cũng muốn ôm em một cái.",
      "Em xứng đáng được yêu thương thật nhiều.",
      "Chỉ cần em vui là anh thấy đủ rồi." 
    ];

    function showMessage() {
      const randomIndex = Math.floor(Math.random() * messages.length);
      document.getElementById("message").textContent = messages[randomIndex];
    }
  </script>
</body>
</html>
